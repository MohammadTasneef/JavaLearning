# Everything here can be overridden by an environment variable of the same name in
# upper case with dots replaced by underscores, e.g. JIRA_PASSWORD for jira.password.
# Anything sensitive is left blank on purpose - set it in your environment, not here.

# Zephyr test cycles page for the project under test
jira.url=https://your-jira-host/projects/PROJECTKEY?selectedItem=com.thed.zephyr.je%3Azephyr-tests-page#test-cycles-tab

jira.username=
jira.password=

# Google Sheet holding the manual test cases
spreadsheet.id=
sheet.name=Manual

# Absolute path to the Google service account json. Keep the file outside the repo.
google.credentials.path=

browser=chrome
